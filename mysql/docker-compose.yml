# Specify the version of the Docker Compose file format
version: '3.8'

# Define the services that will run in your application
services:

  # Configuration for the MySQL database service
  mysqldb:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: items
      MYSQL_USER: productuser
      MYSQL_PASSWORD: productpass123
    volumes:
      # Mount a volume to persist MySQL data
      - ./mysql_data:/var/lib/mysql
    networks:
      - app_network

  #PHPMYADMIN for DB UI
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysqldb
      PMA_PORT: 3306
    ports:
      - "8082:80"
    depends_on:
      - mysqldb 
    networks:
      - app_network

networks:
  app_network:
    external: true
