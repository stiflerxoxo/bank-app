# Specify the version of the Docker Compose file format
version: '3.8'

services:
  backend:
    image: productapp-service
    container_name: productapp-service
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/items
      SPRING_DATASOURCE_USERNAME: productuser
      SPRING_DATASOURCE_PASSWORD: productpass123
    networks:
      - app_network
networks:
  app_network:
    external: true
